# Render blueprint: creates the Memory Circle API as a free web service.
# In the Render dashboard choose "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: memory-circle-api
    runtime: python
    plan: free
    rootDir: backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Store photo bytes in the database so uploads survive restarts
      # (free instances have ephemeral disks).
      - key: ASSET_STORAGE
        value: db
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Paste your Neon (or any) Postgres connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Public site URL, used to build password-reset and campaign links.
      - key: APP_BASE_URL
        value: https://omoidenowa.com
      # Transactional email (Resend). Password recovery and guest email
      # verification stay disabled until these are set in the dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
