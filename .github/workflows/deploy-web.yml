name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        working-directory: apps/mobile_desktop_flutter
        env:
          # Set the API_BASE repository variable to your backend URL,
          # e.g. https://memory-circle-api.onrender.com
          API_BASE: ${{ vars.API_BASE || 'http://127.0.0.1:8000' }}
        run: |
          flutter pub get
          flutter test
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE="$API_BASE"
          echo "omoidenowa.com" > build/web/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile_desktop_flutter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables GitHub Pages for the repo on first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
